name: Stage Main Net primary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure SSH
        env:
          MF_LIFE_DEPLOY_KEY: ${{ secrets.MF_LIFE_DEPLOY_KEY }}
          MF_LIFE_HOST_KEY: ${{ secrets.MF_LIFE_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MF_LIFE_DEPLOY_KEY" > ~/.ssh/id_ed25519_primary
          printf '%s\n' "$MF_LIFE_HOST_KEY" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519_primary ~/.ssh/known_hosts
      - name: Stage production configuration and secrets
        env:
          MF_LIFE_SSH_HOST: ${{ secrets.MF_LIFE_SSH_HOST }}
          MF_LIFE_SSH_USER: ${{ secrets.MF_LIFE_SSH_USER }}
          MF_LIFE_SSH_PORT: ${{ secrets.MF_LIFE_SSH_PORT }}
          V1: ${{ secrets.MFC_MAINNET_VALIDATOR_1_JSON }}
          V2: ${{ secrets.MFC_MAINNET_VALIDATOR_2_JSON }}
          V3: ${{ secrets.MFC_MAINNET_VALIDATOR_3_JSON }}
          V4: ${{ secrets.MFC_MAINNET_VALIDATOR_4_JSON }}
          P1: ${{ secrets.MFC_MAINNET_PAYOUT_1_JSON }}
          P2: ${{ secrets.MFC_MAINNET_PAYOUT_2_JSON }}
          P3: ${{ secrets.MFC_MAINNET_PAYOUT_3_JSON }}
          P4: ${{ secrets.MFC_MAINNET_PAYOUT_4_JSON }}
          G1: ${{ secrets.MFC_MAINNET_GOVERNANCE_1_JSON }}
          G2: ${{ secrets.MFC_MAINNET_GOVERNANCE_2_JSON }}
          G3: ${{ secrets.MFC_MAINNET_GOVERNANCE_3_JSON }}
          R1: ${{ secrets.MFC_MAINNET_RELAYER_1_JSON }}
          R2: ${{ secrets.MFC_MAINNET_RELAYER_2_JSON }}
          TREASURY: ${{ secrets.MFC_MAINNET_TREASURY_JSON }}
        run: |
          set -euo pipefail
          PRIMARY="ssh -i ~/.ssh/id_ed25519_primary -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $MF_LIFE_SSH_PORT"
          TARGET="$MF_LIFE_SSH_USER@$MF_LIFE_SSH_HOST"
          ROOT=/var/tmp/mfcoin-mainnet
          $PRIMARY "$TARGET" "mkdir -p $ROOT/secrets $ROOT/target/release"
          rsync -az -e "ssh -i $HOME/.ssh/id_ed25519_primary -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $MF_LIFE_SSH_PORT" production.mainnet.json infra/mainnet/deploy-mainnet-validators.sh infra/mainnet/deploy-archive.sh scripts/bootstrap-rehearsal.mjs "$TARGET:$ROOT/"
          put_secret() {
            local contents=$1
            local destination=$2
            printf '%s' "$contents" | $PRIMARY "$TARGET" "cat > $destination && chmod 600 $destination"
          }
          for index in 1 2 3 4; do
            eval "validator=\$V$index"
            eval "payout=\$P$index"
            put_secret "$validator" "$ROOT/secrets/validator-$index.json"
            put_secret "$payout" "$ROOT/secrets/payout-$index.json"
          done
          for index in 1 2 3; do
            eval "governance=\$G$index"
            put_secret "$governance" "$ROOT/secrets/governance-$index.json"
          done
          for index in 1 2; do
            eval "relayer=\$R$index"
            put_secret "$relayer" "$ROOT/secrets/relayer-$index.json"
          done
          put_secret "$TREASURY" "$ROOT/secrets/treasury.json"
          $PRIMARY "$TARGET" "chmod 755 $ROOT/deploy-mainnet-validators.sh $ROOT/deploy-archive.sh"
