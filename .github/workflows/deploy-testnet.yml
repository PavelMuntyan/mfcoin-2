name: Deploy MFCoin Testnet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies
      - name: Build node and testnet operator tools
        run: |
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          cargo +1.88.0 build --locked --release
          cargo +1.88.0 build --locked --release --examples
        timeout-minutes: 90
      - name: Package Ubuntu artifacts
        run: tar -czf mfc112-artifacts.tar.gz \
          target/release/solochain-template-node \
          target/release/examples/generate_testnet_keys \
          target/release/examples/reward_relayer \
          target/release/examples/register_validator_payout \
          target/release/examples/validator_rewards
      - uses: actions/upload-artifact@v4
        with:
          name: mfc112-artifacts
          path: mfc112-artifacts.tar.gz
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mfc112-artifacts
      - name: Configure SSH
        env:
          MF_LIFE_DEPLOY_KEY: ${{ secrets.MF_LIFE_DEPLOY_KEY }}
          MF_LIFE_HOST_KEY: ${{ secrets.MF_LIFE_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MF_LIFE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$MF_LIFE_HOST_KEY" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy runtime-112 testnet
        env:
          MF_LIFE_SSH_HOST: ${{ secrets.MF_LIFE_SSH_HOST }}
          MF_LIFE_SSH_USER: ${{ secrets.MF_LIFE_SSH_USER }}
          MF_LIFE_SSH_PORT: ${{ secrets.MF_LIFE_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -p $MF_LIFE_SSH_PORT"
          TARGET="$MF_LIFE_SSH_USER@$MF_LIFE_SSH_HOST"
          RSYNC_SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p $MF_LIFE_SSH_PORT"
          $SSH "$TARGET" 'mkdir -p /var/www/balexey/data/mfcoin-testnet/infra/testnet /var/www/balexey/data/mfcoin-testnet/data'
          rsync -az -e "$RSYNC_SSH" mfc112-artifacts.tar.gz "$TARGET:/var/www/balexey/data/mfcoin-testnet/"
          rsync -az -e "$RSYNC_SSH" infra/testnet/ "$TARGET:/var/www/balexey/data/mfcoin-testnet/infra/testnet/"
          $SSH "$TARGET" 'cd /var/www/balexey/data/mfcoin-testnet && tar -xzf mfc112-artifacts.tar.gz && bash infra/testnet/deploy.sh'
