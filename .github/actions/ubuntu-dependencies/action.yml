name: Install Ubuntu dependencies
description: Installs dependencies required to compile the template in Ubuntu

runs:
  using: "composite"
  steps:
    - name: Rust compilation prerequisites (Ubuntu)
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt update
        sudo apt install -y \
          protobuf-compiler \
          llvm-dev libclang-dev clang
        rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy,rust-src --target wasm32-unknown-unknown
      shell: bash
